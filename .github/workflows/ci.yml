name: CI

# Lint + build check for pull requests (deploy runs only from main)
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: CSS bundle size
        run: ls -la dist/assets/*.css
